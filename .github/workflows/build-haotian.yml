name: Build Skyward for haotian

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Skyward binary for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a --platform 30 build --release -p skyward

      - name: Build Skyward packer for host
        run: |
          cargo build --release -p skyward-pack

      - name: Download stock recovery from haotian OTA
        run: |
          ./target/release/skyward-pack stock \
            --config devices/haotian.toml \
            --out target/stock/haotian/recovery.img

      - name: Build final Skyward image
        run: |
          ./target/release/skyward-pack recovery \
            --stock target/stock/haotian/recovery.img \
            --binary target/aarch64-linux-android/release/skyward \
            --config devices/haotian.toml \
            --font resources/fonts/MiSansVF.ttf \
            --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt \
            --out target/skyward-haotian.img

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: skyward-haotian
          path: target/skyward-haotian.img
          if-no-files-found: error
