[device]
codename = "piano"
brand = "Xiaomi"
model = "Xiaomi Pad 8 Pro"
tablet = true
supports_vibration = false
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
width = 3200
height = 2136
density = 440
diagonal = 11.2
corner_radius = 55

[init]
properties = { "vendor.gatekeeper.is_security_level_spu" = "0", "vendor.keymint.retry_timer" = "5" }

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
load = ["nt36532_touch"]

[touch]
swap_xy = true
flip_y = true
ignored_devices = ["NVTCapacitivePenP81c", "NVTCapacitivePenM80p"]

[firmware]
partition = "modem"
remoteproc = "adsp"

[partitions]
mounted = ["persist"]

[logd]
libraries = ["/mnt/system/system/lib64/libsysutils.so", "/mnt/system/system/lib64/libcap.so"]

[disk]
device = "/dev/block/sda"
gadget = "/config/usb_gadget/g1"

[disk.mass_storage]
start_script = { source = "../resources/piano/piano-msc-start.sh", path = "/piano/bin/piano-msc-start.sh" }
unmount_script = { source = "../resources/piano/piano-msc-unmount.sh", path = "/piano/bin/piano-msc-unmount.sh" }
controller = "a600000.dwc3"
vendor_id = 0x2717
product_id = 0x9039

[disk.gpt]
disks = ["sda", "sdb", "sdc", "sdd", "sde", "sdf"]
prepare_script = { source = "../resources/piano/piano-fixgpt-unmount.sh", path = "/piano/bin/piano-fixgpt-unmount.sh" }
gdisk = { source = "../resources/piano/gdisk", path = "/system/bin/gdisk" }
dmctl = { source = "../resources/piano/dmctl", path = "/system/bin/dmctl" }
uuid_library = { source = "../resources/piano/libext2_uuid.so", path = "/system/lib64/libext2_uuid.so" }
parted = { source = "../resources/piano/parted", path = "/system/bin/parted", sha256 = "6e0751b70b46f6eeec1595c356313ec393fe906182796adf86467772cb1c93ef" }
parted_libraries = [
    { source = "../resources/piano/libparted.so", path = "/system/lib64/libparted.so", sha256 = "e316cc0814df8a4a452ab046be546535b25b9a29401fbc9766469e150b07e775" },
    { source = "../resources/piano/libparted-fs-resize.so", path = "/system/lib64/libparted-fs-resize.so", sha256 = "5a0d4d5e69b9217a9d2581deca9f4ee3a1b1c83cc9083042d5f93fb4310b6f9c" },
    { source = "../resources/piano/libreadline.so.8", path = "/system/lib64/libreadline.so.8", sha256 = "7437d5e30e2a326f3000286295cb9ba30a2e45f9ca5a91feba9ec12d0f1a161d" },
    { source = "../resources/piano/libncursesw.so.6", path = "/system/lib64/libncursesw.so.6", sha256 = "795f855f5a988d9e89116847b2c9aa03720cedbc02026259ca735be25398c4c5" },
    { source = "../resources/piano/libuuid.so", path = "/system/lib64/libuuid.so", sha256 = "f6a537868ff4553b66e0814532e8b3774c2db4c7c66b225bb03a780059216e70" },
    { source = "../resources/piano/libblkid.so", path = "/system/lib64/libblkid.so", sha256 = "d6a7e834a2c9756dbadec1ce076bb7637310750d912f3b9ab510368052314010" },
    { source = "../resources/piano/libiconv.so", path = "/system/lib64/libiconv.so", sha256 = "540df15e445f9117ce757dedf54fefd93c4db34ecf2caf06ef1cb397ac6fc940" },
    { source = "../resources/piano/libandroid-support.so", path = "/system/lib64/libandroid-support.so", sha256 = "739cf829511d71dafd6c67fdbb70f3f0c6048642ea2e1967790ee961fde14430" },
    { source = "../resources/piano/libandroid-posix-semaphore.so", path = "/system/lib64/libandroid-posix-semaphore.so", sha256 = "bee8c749ff4a87c06c4f6316a380f179f607de7d904418a20d879eea74be345e" },
]
input = "x\nj\n\nk\n\nw\nY\n"
success = "The operation has completed successfully."

# What the phone's own init runs once the system has finished starting.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The panel hands raw frames to the stock touch stack.
[[service]]
path = "/odm/bin/touch_report_debug"
libraries = ["/odm/lib64", "/vendor/lib64", "/system/lib64"]
user = "root"
groups = ["root", "input", "system"]
capabilities = ["SYS_NICE"]

[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.boot.IBootControl/default"
description = "/vendor/etc/vintf/manifest/boot-service.qti.xml"
user = "root"
groups = ["root"]

[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]
sockets = [{ name = "notify-topology", kind = "stream", mode = 0o660, user = "system", group = "drmrpc" }]

[[service]]
path = "/vendor/bin/hlosminkdaemon"
libraries = ["/system/lib64", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
user = "system"
groups = ["system"]
sockets = [{ name = "hlos_mink_opener", kind = "stream", mode = 0o660, user = "system", group = "system" }]

[[service]]
path = "/vendor/bin/ssgtzd"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
user = "system"
groups = ["system", "oem_2912", "wakelock"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]
sockets = [
    { name = "ssgtzd", kind = "stream", mode = 0o660, user = "system", group = "oem_2912" },
    { name = "ssgtzd_opener", kind = "stream", mode = 0o660, user = "system", group = "system" },
]

[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-service-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
description = "/vendor/etc/vintf/manifest_sun.xml"
user = "system"
groups = ["system"]

[[service]]
path = "/odm/bin/hw/android.hardware.weaver"
libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.weaver.IWeaver/default"
description = "/odm/etc/vintf/manifest/android.hardware.weaver.xml"
user = "system"
groups = ["system", "drmrpc"]

[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"

